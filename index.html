<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2359d1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ZENVORA">
    <title>Zenvora Search</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/pwa.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="home">
      <section class="search-panel" aria-labelledby="brand">
        <a class="brand" id="brand" href="/" aria-label="Zenvora home">
          <img class="brand-mark" src="/logo.svg" alt="">
          <span id="brand-name">Zenvora</span>
        </a>
        <p class="tagline" id="tagline">Search the web with ease</p>
        <nav class="page-nav" aria-label="Main navigation">
          <a class="page-nav-link active" href="/" aria-current="page">Search</a>
          <a class="page-nav-link" href="/apps">Apps</a>
          <a class="page-nav-link" href="/videos">Videos</a>
          <a class="page-nav-link" href="/download">Download</a>
          <a class="page-nav-link" id="account-link" href="/account">Sign in</a>
        </nav>
        <nav class="search-tabs" aria-label="Search category">
          <button class="tab active" type="submit" form="search-form" name="type" value="all" aria-pressed="true">All</button>
          <button class="tab" type="submit" form="search-form" name="type" value="websites">Websites</button>
          <button class="tab" type="submit" form="search-form" name="type" value="videos">Videos</button>
        </nav>
        <div class="search-box-wrap">
          <form class="search-form" id="search-form" action="/search" method="get">
            <label class="sr-only" for="query">Search the web, saved websites, and videos</label>
            <span class="search-icon" aria-hidden="true"></span>
            <input id="query" name="q" type="search" maxlength="200" autocomplete="off" placeholder="Search the web and your saved sites" role="combobox" aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false">
            <button class="search-submit" type="submit" name="type" value="all">Search</button>
          </form>
          <ul class="search-suggestions" id="search-suggestions" role="listbox" aria-label="Saved website and video suggestions" hidden></ul>
        </div>
        <div class="shortcuts" aria-label="Search tips">
          <span>Search the public web</span>
          <span>Find saved websites</span>
          <span>Find your videos</span>
        </div>
        <nav class="website-shortcuts" id="website-shortcuts" aria-label="Your websites" hidden></nav>
        <p class="form-message search-feedback" id="search-feedback" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="footer">
      <span>Make the web yours.</span>
    </footer>
  </body>
</html>
