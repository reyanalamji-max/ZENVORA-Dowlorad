<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101a35">
    <title>ZENVORA Search</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #101a35; color: #f5f7ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { max-width: 340px; display: grid; justify-items: center; gap: 18px; text-align: center; }
      img { width: 78px; height: 78px; border-radius: 22px; box-shadow: 0 12px 38px rgb(0 0 0 / 30%); }
      h1 { margin: 0; font-size: 20px; letter-spacing: 1.8px; }
      p { margin: 0; color: #aab6cf; font-size: 13px; line-height: 1.6; }
      .spinner { width: 22px; height: 22px; border: 2px solid rgb(255 255 255 / 20%); border-top-color: #93b4ff; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
    <meta name="google-adsense-account" content="ca-pub-9688586488781761">
  </head>
  <body>
    <main>
      <img src="zenvora-icon.png" alt="">
      <h1>ZENVORA SEARCH</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p>Connecting to ZENVORA Search…</p>
    </main>
  </body>
</html>
